stages:
  - build_push
  - deploy

variables:
  REGISTRY: ccr.ccs.tencentyun.com
  NAMESPACE: my-agent-server
  IMAGE_NAME: fastapi-first
  CONTAINER_NAME: fastapi-first
  APP_PORT: "8000"
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  # Gitee 流水线变量（可选，未设则用下列默认）
  DEPLOY_ENV_FILE: /opt/my-agent-server/.env
  HOST_PORT: "8000"

build_push:
  stage: build_push
  image: docker:24-cli
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - echo "$DOCKER_PWD" | docker login "$REGISTRY" -u "$DOCKER_USER" --password-stdin
  script:
    - export FULL_IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME"
    - docker build -t "$FULL_IMAGE:$IMAGE_TAG" -t "$FULL_IMAGE:latest" .
    - docker push "$FULL_IMAGE:$IMAGE_TAG"
    - docker push "$FULL_IMAGE:latest"
  only:
    - main
    - master

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SERVER_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
  script:
    - export FULL_IMAGE="$REGISTRY/$NAMESPACE/$IMAGE_NAME"
    - export HOST_PORT="${HOST_PORT:-8000}"
    - export DEPLOY_ENV_FILE="${DEPLOY_ENV_FILE:-/opt/my-agent-server/.env}"
    - |
      ssh "$SERVER_USER@$SERVER_HOST" bash -s <<EOF
      set -euo pipefail
      echo "$DOCKER_PWD" | docker login "$REGISTRY" -u "$DOCKER_USER" --password-stdin
      docker pull "$FULL_IMAGE:latest"
      docker stop "$CONTAINER_NAME" 2>/dev/null || true
      docker rm "$CONTAINER_NAME" 2>/dev/null || true
      if [ ! -f "$DEPLOY_ENV_FILE" ]; then
        echo "缺少环境文件: $DEPLOY_ENV_FILE（请先在服务器创建并填写 .env）" >&2
        exit 1
      fi
      docker run -d \
        --name "$CONTAINER_NAME" \
        --restart unless-stopped \
        -p "${HOST_PORT}:${APP_PORT}" \
        --env-file "$DEPLOY_ENV_FILE" \
        "$FULL_IMAGE:latest"
      docker image prune -f
      docker ps --filter "name=$CONTAINER_NAME"
      EOF
  only:
    - main
    - master
