# Gitee Go 流水线（社区版可用；非 GitLab CI 语法）
# 文档：https://help.gitee.com/gitee-go/pipeline/scheduling
#
# 构建阶段 build@docker：在 Gitee 官方「共享构建资源」上执行（无需自建 Runner）。
# 部署阶段 shell@agent：在已接入「主机组」的 CVM 上执行（非共享构建机）。
# 若尚未配置主机组，可仅运行 build_push，再在服务器按 README 手动 docker pull/run。
version: "1.0"
name: fastapi-first-deploy
displayName: FastAPI 构建并部署

triggers:
  push:
    branches:
      precise:
        - main
        - master

stages:
  - stage:
      name: build_push
      displayName: 构建并推送镜像
      strategy: naturally
      trigger: auto
      steps:
        - step: build@docker
          name: build_docker
          displayName: 推送至腾讯云 TCR
          repository: ccr.ccs.tencentyun.com/my-agent-server
          username: ${DOCKER_USER}
          password: ${DOCKER_PWD}
          tag: fastapi-first:${GITEE_PIPELINE_BUILD_NUMBER}
          dockerfile: ./Dockerfile
          isCache: false

  - stage:
      name: deploy
      displayName: 部署到 CVM
      strategy: naturally
      # 未配置主机组时可改为 manual，构建成功后手动点「部署」；或删除本阶段改用手动部署
      trigger: manual
      steps:
        - step: shell@agent
          name: deploy_container
          displayName: 拉取镜像并启动容器
          # 在 Gitee Go「主机管理」创建主机组后，将唯一标识填到流水线变量 DEPLOY_HOST_GROUP
          hostGroupID: ${DEPLOY_HOST_GROUP}
          script: |
            set -euo pipefail
            IMAGE="${GITEE_DOCKER_IMAGE}"
            CONTAINER_NAME="fastapi-first"
            ENV_FILE="${DEPLOY_ENV_FILE:-/opt/my-agent-server/.env}"
            HOST_PORT="${HOST_PORT:-8000}"
            APP_PORT="8000"

            echo "${DOCKER_PWD}" | docker login ccr.ccs.tencentyun.com -u "${DOCKER_USER}" --password-stdin
            docker pull "${IMAGE}"

            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm "${CONTAINER_NAME}" 2>/dev/null || true

            if [ ! -f "${ENV_FILE}" ]; then
              echo "缺少环境文件: ${ENV_FILE}（请先在服务器创建并填写 .env）" >&2
              exit 1
            fi

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "${HOST_PORT}:${APP_PORT}" \
              --env-file "${ENV_FILE}" \
              "${IMAGE}"

            docker image prune -f
            docker ps --filter "name=${CONTAINER_NAME}"
