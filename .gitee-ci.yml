stages:
  - build
  - push
  - deploy

variables:
  IMAGE_NAME: my-python-app
  IMAGE_TAG: $CI_COMMIT_SHA
  REGISTRY: ccr.ccs.tencentyun.com    # 腾讯云镜像仓库地址
  NAMESPACE: your-namespace           # 命名空间

# 阶段1：构建 Docker 镜像
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $REGISTRY/$NAMESPACE/$IMAGE_NAME:$IMAGE_TAG
    - docker tag $IMAGE_NAME:$IMAGE_TAG $REGISTRY/$NAMESPACE/$IMAGE_NAME:latest
  only:
    - master

# 阶段2：推送镜像到仓库
push:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo $DOCKER_PWD | docker login $REGISTRY -u $DOCKER_USER --password-stdin
    - docker push $REGISTRY/$NAMESPACE/$IMAGE_NAME:$IMAGE_TAG
    - docker push $REGISTRY/$NAMESPACE/$IMAGE_NAME:latest
  only:
    - master

# 阶段3：部署到服务器
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SERVER_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_HOST << 'EOF'
        # 登录镜像仓库
        echo $DOCKER_PWD | docker login $REGISTRY -u $DOCKER_USER --password-stdin
        
        # 拉取最新镜像
        docker pull $REGISTRY/$NAMESPACE/$IMAGE_NAME:latest
        
        # 停止并删除旧容器
        docker stop $IMAGE_NAME || true
        docker rm $IMAGE_NAME || true
        
        # 启动新容器
        docker run -d \
          --name $IMAGE_NAME \
          --restart always \
          -p 8080:8080 \
          -v /data/logs:/app/logs \
          $REGISTRY/$NAMESPACE/$IMAGE_NAME:latest
        
        # 清理旧镜像
        docker image prune -f
      EOF
  only:
    - master